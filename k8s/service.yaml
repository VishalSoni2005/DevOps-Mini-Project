# ============================================
# Application Service
# ============================================
apiVersion: v1
kind: Service
metadata:
  name: supply-chain-service
  namespace: supply-chain
  labels:
    app: supply-chain-app
spec:
  type: LoadBalancer
  selector:
    app: supply-chain-app
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP

---
# ============================================
# Horizontal Pod Autoscaler
# ============================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: supply-chain-hpa
  namespace: supply-chain
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: supply-chain-app
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
