# ============================================
# Filebeat DaemonSet
# Collects container logs from all nodes and
# forwards them to Logstash for processing.
# ============================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: filebeat-config
  namespace: elk
data:
  filebeat.yml: |
    filebeat.inputs:
      # Collect container logs
      - type: container
        paths:
          - /var/log/containers/supply-chain-*.log
        processors:
          - add_kubernetes_metadata:
              host: ${NODE_NAME}
              matchers:
                - logs_path:
                    logs_path: "/var/log/containers/"

      # Collect application JSON logs
      - type: log
        paths:
          - /var/log/supply-chain/*.json
        json.keys_under_root: true
        json.add_error_key: true
        json.message_key: message
        fields:
          log_type: application
        fields_under_root: true

    # Processors
    processors:
      - add_cloud_metadata: ~
      - add_host_metadata: ~
      - drop_fields:
          fields: ["agent.ephemeral_id", "agent.id", "agent.version", "ecs.version"]

    # Output to Logstash
    output.logstash:
      hosts: ["logstash-service.elk.svc.cluster.local:5044"]
      bulk_max_size: 2048

    # Logging
    logging.level: info
    logging.to_files: false

---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: filebeat
  namespace: elk
  labels:
    app: filebeat
spec:
  selector:
    matchLabels:
      app: filebeat
  template:
    metadata:
      labels:
        app: filebeat
    spec:
      serviceAccountName: filebeat
      terminationGracePeriodSeconds: 30
      containers:
        - name: filebeat
          image: docker.elastic.co/beats/filebeat:8.12.0
          args: ["-c", "/etc/filebeat/filebeat.yml", "-e"]
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          volumeMounts:
            - name: config
              mountPath: /etc/filebeat
              readOnly: true
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: varlibdockercontainers
              mountPath: /var/lib/docker/containers
              readOnly: true
            - name: supply-chain-logs
              mountPath: /var/log/supply-chain
              readOnly: true
          securityContext:
            runAsUser: 0
      volumes:
        - name: config
          configMap:
            name: filebeat-config
            defaultMode: 0640
        - name: varlog
          hostPath:
            path: /var/log
        - name: varlibdockercontainers
          hostPath:
            path: /var/lib/docker/containers
        - name: supply-chain-logs
          hostPath:
            path: /var/log/supply-chain

---
# Filebeat ServiceAccount and ClusterRole
apiVersion: v1
kind: ServiceAccount
metadata:
  name: filebeat
  namespace: elk

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: filebeat
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces", "nodes"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: filebeat
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: filebeat
subjects:
  - kind: ServiceAccount
    name: filebeat
    namespace: elk
