# ============================================================
# Docker Compose — Local Development Stack
# Supply Chain Management + ELK Logging
# ============================================================
# Usage:
#   docker-compose up -d          # Start all services
#   docker-compose logs -f app    # Tail application logs
#   docker-compose down -v        # Stop and clean up
# ============================================================

version: '3.8'

services:

  # ──────────────────────────────────────────
  # Supply Chain Management Application
  # ──────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: supply-chain-app
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - LOGGING_LEVEL_COM_SUPPLYCHAIN=DEBUG
    volumes:
      - app-logs:/var/log/supply-chain
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - supply-chain-net
    restart: unless-stopped

  # ──────────────────────────────────────────
  # Elasticsearch
  # ──────────────────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - cluster.name=supply-chain-logs
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    networks:
      - supply-chain-net
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  # ──────────────────────────────────────────
  # Logstash
  # ──────────────────────────────────────────
  logstash:
    image: docker.elastic.co/logstash/logstash:8.12.0
    container_name: logstash
    ports:
      - "5044:5044"
      - "5000:5000"
      - "9600:9600"
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
      - app-logs:/var/log/supply-chain:ro
    environment:
      - LS_JAVA_OPTS=-Xms256m -Xmx256m
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - supply-chain-net
    restart: unless-stopped

  # ──────────────────────────────────────────
  # Kibana
  # ──────────────────────────────────────────
  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.0
    container_name: kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=["http://elasticsearch:9200"]
      - SERVER_NAME=supply-chain-kibana
      - XPACK_SECURITY_ENABLED=false
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - supply-chain-net
    restart: unless-stopped

  # ──────────────────────────────────────────
  # Filebeat (Log Shipper)
  # ──────────────────────────────────────────
  filebeat:
    image: docker.elastic.co/beats/filebeat:8.12.0
    container_name: filebeat
    user: root
    command: filebeat -e -strict.perms=false
    volumes:
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - app-logs:/var/log/supply-chain:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - logstash
    networks:
      - supply-chain-net
    restart: unless-stopped

volumes:
  es-data:
    driver: local
  app-logs:
    driver: local

networks:
  supply-chain-net:
    driver: bridge
