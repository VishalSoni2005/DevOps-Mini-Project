# ──────────────────────────────────────────────
# Logstash Pipeline Configuration (Local Dev)
# ──────────────────────────────────────────────

input {
  # Beats input (from Filebeat)
  beats {
    port => 5044
    type => "filebeat"
  }

  # Direct TCP input for JSON logs
  tcp {
    port => 5000
    codec => json_lines
    type => "direct"
  }

  # Read JSON log files directly
  file {
    path => "/var/log/supply-chain/application.json"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    codec => json
    type => "application"
  }

  file {
    path => "/var/log/supply-chain/error.json"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    codec => json
    type => "error"
  }
}

filter {
  # Parse JSON messages
  if [message] and [message] =~ /^\{/ {
    json {
      source => "message"
      target => "parsed"
      skip_on_invalid_json => true
    }
  }

  # Extract supply chain event patterns
  if [message] {
    grok {
      match => {
        "message" => [
          "%{WORD:event_category}_%{WORD:event_type}: action=%{WORD:action}(?:, %{GREEDYDATA:event_details})?",
          "%{WORD:alert_category}_ALERT: component=%{WORD:component}(?:, %{GREEDYDATA:alert_details})?",
          "API_REQUEST: method=%{WORD:http_method}, endpoint=%{URIPATH:endpoint}",
          "API_TIMEOUT: endpoint=%{URIPATH:timeout_endpoint}"
        ]
      }
      tag_on_failure => ["_grok_no_match"]
    }
  }

  # Classify severity
  if [level] == "ERROR" or [parsed][level] == "ERROR" {
    mutate { add_field => { "severity" => "error" } }
  } else if [level] == "WARN" or [parsed][level] == "WARN" {
    mutate { add_field => { "severity" => "warning" } }
  } else if [level] == "DEBUG" or [parsed][level] == "DEBUG" {
    mutate { add_field => { "severity" => "debug" } }
  } else {
    mutate { add_field => { "severity" => "info" } }
  }

  # Classify event domain
  if [event_category] {
    if [event_category] == "INVENTORY" {
      mutate { add_field => { "domain" => "inventory" } }
    } else if [event_category] == "ORDER" {
      mutate { add_field => { "domain" => "orders" } }
    } else if [event_category] == "SHIPMENT" {
      mutate { add_field => { "domain" => "shipments" } }
    } else if [event_category] == "SYNC" {
      mutate { add_field => { "domain" => "integration" } }
    } else if [event_category] == "SYSTEM" {
      mutate { add_field => { "domain" => "infrastructure" } }
    } else if [event_category] == "SIMULATION" {
      mutate { add_field => { "domain" => "simulation" } }
    } else {
      mutate { add_field => { "domain" => "general" } }
    }
  }

  # Add pipeline metadata
  mutate {
    add_field => {
      "application" => "supply-chain-management"
      "environment" => "development"
    }
  }

  # Timestamp parsing
  date {
    match => ["timestamp", "ISO8601", "yyyy-MM-dd HH:mm:ss.SSS"]
    target => "@timestamp"
    tag_on_failure => ["_timestamp_parse_failure"]
  }
}

output {
  # All logs index
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "supply-chain-logs-%{+YYYY.MM.dd}"
  }

  # Errors-only index for fast querying
  if [severity] == "error" {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "supply-chain-errors-%{+YYYY.MM.dd}"
    }
  }

  # Deployment events index
  if [event_category] == "DEPLOYMENT" or [domain] == "infrastructure" {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "supply-chain-deployments-%{+YYYY.MM.dd}"
    }
  }

  # Console output for debugging
  stdout {
    codec => rubydebug
  }
}
