# ============================================
# Supply Chain Management Application
# ============================================

spring.application.name=supply-chain-management

# Server Configuration
server.port=8080
server.servlet.context-path=/

# H2 In-Memory Database (Demo)
spring.datasource.url=jdbc:h2:mem:supplychain
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Actuator Endpoints (for health checks and metrics)
management.endpoints.web.exposure.include=health,info,metrics,loggers
management.endpoint.health.show-details=always
management.info.env.enabled=true

# Application Info (exposed by Actuator)
info.app.name=Supply Chain Management System
info.app.description=Enterprise SCM with CI/CD and ELK Logging
info.app.version=1.0.0

# Logging
logging.level.com.supplychain=DEBUG
logging.level.org.springframework.web=INFO
